<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت دانش‌آموزان</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4">لیست دانش‌آموزان</h2>
        <button onclick="fetchStudents()" class="btn btn-outline-primary btn-sm">به‌روزرسانی داده‌ها</button>
    </div>

    <!-- فیلد جستجو -->
    <div class="mb-3">
        <input type="text" id="searchInput" onkeyup="filterStudents()" class="form-control" placeholder="جستجو بر اساس نام، فامیلی یا شماره دانش‌آموزی...">
    </div>

    <!-- پیام خطا یا بارگذاری -->
    <div id="statusMessage" class="alert alert-info d-none">در حال دریافت اطلاعات...</div>

    <!-- جدول داده‌ها -->
    <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th>شماره دانش‌آموزی</th>
                <th>نام</th>
                <th>نام خانوادگی</th>
                <th>معدل (نمره)</th>
                <th>جنسیت</th>
                <th>واحدهای مانده</th>
                <th>تاریخ تولد</th>
            </tr>
            </thead>
            <tbody id="studentTableBody">
            <!-- داده‌ها توسط JS اضافه می‌شوند -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:5139/DataBase/students';
    let studentsData = [];

    async function fetchStudents() {
        const statusMsg = document.getElementById('statusMessage');
        const tableBody = document.getElementById('studentTableBody');

        statusMsg.className = 'alert alert-info';
        statusMsg.textContent = 'در حال دریافت اطلاعات...';
        statusMsg.classList.remove('d-none');
        tableBody.innerHTML = '';

        try {
            // اضافه کردن cache: 'no-store' جهت دریافت مستقیم داده از دیتابیس جدید
            const response = await fetch(API_URL, { cache: 'no-store' });
            if (!response.ok) throw new Error('خطا در برقراری ارتباط با سرور');

            const result = await response.json();

            if (result.success && result.data) {
                studentsData = result.data;
                renderTable(studentsData);
                statusMsg.classList.add('d-none');
            } else {
                statusMsg.className = 'alert alert-warning';
                statusMsg.textContent = result.message || 'هیچ داده‌ای یافت نشد.';
            }
        } catch (error) {
            statusMsg.className = 'alert alert-danger';
            statusMsg.textContent = error.message;
        }
    }

    function renderTable(list) {
        const tableBody = document.getElementById('studentTableBody');
        tableBody.innerHTML = '';

        if (list.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" class="text-center">دانش‌آموزی یافت نشد.</td></tr>';
            return;
        }

        list.forEach(student => {
            const birthDate = student.dateofbirth ? new Date(student.dateofbirth).toLocaleDateString('fa-IR') : 'نامشخص';
            const row = `
                    <tr>
                        <td><strong>${student.studentnumber}</strong></td>
                        <td>${student.firstname ?? ''}</td>
                        <td>${student.lastname ?? ''}</td>
                        <td><span class="badge ${student.grade >= 10 ? 'bg-success' : 'bg-danger'}">${student.grade}</span></td>
                        <td>${student.ismale ? 'مرد' : 'زن'}</td>
                        <td>${student.leftunitscount}</td>
                        <td>${birthDate}</td>
                    </tr>
                `;
            tableBody.insertAdjacentHTML('beforeend', row);
        });
    }

    function filterStudents() {
        const term = document.getElementById('searchInput').value.toLowerCase().trim();
        const filtered = studentsData.filter(s =>
            (s.firstname && s.firstname.toLowerCase().includes(term)) ||
            (s.lastname && s.lastname.toLowerCase().includes(term)) ||
            (s.studentnumber && s.studentnumber.toString().toLowerCase().includes(term))
        );
        renderTable(filtered);
    }

    // بارگذاری اولیه هنگام باز شدن صفحه
    document.addEventListener('DOMContentLoaded', fetchStudents);
</script>

</body>
</html>
